<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Welcome to Fake Jeopardy</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <link href="css/style.css" rel="stylesheet">

</head>
<body>

<div id="container">
    <header>
        <h1>Welcome to Fake Jeopardy</h1>
    </header>


    <div id="gameBoard">
        <div class="category"></div>
        <div class="category"></div>
        <div class="category"></div>
        <div class="category"></div>
        <div class="category"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
        <div class="question"></div>
    </div>


    <div id="gameInfo">
        <div id="controls">
            <button class='btn' id="startButton">Start</button>
            <button class="'btn' " disabled id="resetButton">Reset</button>
        </div>

        <div id="feedback">Click Start to begin.</div>

        <div id="score">
            Score: <span id="total">0</span>
        </div>

        <!-- Stopwatch -->
        <div id="time">
            <span class="digit" id="hr">00</span>
            <span class="txt">:</span>
            <span class="digit" id="min">00</span>
            <span class="txt">:</span>
            <span class="digit" id="sec">00</span>
            <span class="txt">:</span>
            <span class="digit" id="count">00</span>
        </div>

    </div>


</div><!--container-->

<!-- The Modal -->
<div class="modal" id="qaModal">

    <!-- Modal content -->
    <div class="modal-content">
        <span class="close">&times;</span>
        <div id="questionArea">
            <p> Pretend question</p>
        </div>

        <div id="answerArea">
            <form>
                <div><input id="1" name="qa" type="radio" > <label for="1">Answer</label></div>
                <div><input id="2" name="qa" type="radio" > <label for="2">Answer</label></div>
                <div><input id="3" name="qa" type="radio" > <label for="3">Answer</label></div>
                <div><input id="4" name="qa" type="radio" > <label for="4">Answer</label></div>
            </form>

            <button id="submitResponse">Submit Answer</button>
        </div>

    </div><!-- .modal-content -->

</div><!-- .modal-->


<script src="js/script.js" type="text/javascript"></script>
</body>


</html>
